version: '3.8'

services:
  # PostgreSQL database with pgvector pre-installed
  postgres:
    image: ankane/pgvector:latest
    container_name: apex-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Standard local Redis (for local caching fallback, though Upstash is configured)
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
