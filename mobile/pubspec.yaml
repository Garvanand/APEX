name: apex_mobile
description: "APEX - Adaptive Presence & Execution Intelligence Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & WebSocket Client
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  
  # State Management & Helpers
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  mobile_scanner: ^5.0.0
  sensors_plus: ^7.0.0
  permission_handler: ^12.0.3
  battery_plus: ^7.0.0
  connectivity_plus: ^7.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
